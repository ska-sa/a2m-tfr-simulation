[project]
name = "a2m-tfr"
version = "0.1.0"
description = "Signal-path simulator for the Africa2Moon timing and frequency reference concept"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.scripts]
a2m-tfr = "a2m_tfr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2m_tfr"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

